<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Stateless Calculator</title>
    <!-- Google Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px 0 rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .calculator-card:hover {
            box-shadow: 0 20px 40px 0 rgba(99, 102, 241, 0.05);
            transform: translateY(-2px);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-text, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            color: #fff;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-text:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn-calculate {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px var(--primary-glow);
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-calculate:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        .btn-calculate:active {
            transform: translateY(1px);
        }

        /* Result Panel */
        .result-panel {
            margin-top: 2rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .result-panel.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .result-val {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 1rem;
        }

        .pod-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .pod-badge i {
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Kubernetes Calculator</h1>
        <div class="subtitle">Stateless Microservice</div>

        <div class="form-group">
            <label for="num1">First Number</label>
            <input type="number" id="num1" class="input-text" placeholder="e.g. 10" value="10">
        </div>

        <div class="form-group">
            <label for="operator">Operation</label>
            <select id="operator">
                <option value="+">Addition (+)</option>
                <option value="-">Subtraction (-)</option>
                <option value="*">Multiplication (*)</option>
                <option value="/">Division (/)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="num2">Second Number</label>
            <input type="number" id="num2" class="input-text" placeholder="e.g. 5" value="5">
        </div>

        <button class="btn-calculate" onclick="performCalculation()">
            <i class="fa-solid fa-calculator"></i> Calculate
        </button>

        <div class="result-panel" id="result-panel">
            <div class="result-title">Result</div>
            <div class="result-val" id="result-value">0</div>
            <div class="pod-badge">
                <i class="fa-solid fa-cube"></i>
                <span id="pod-name">Pod Name</span>
            </div>
        </div>
    </div>

    <script>
        async function performCalculation() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const operator = document.getElementById('operator').value;

            if (num1 === '' || num2 === '') {
                alert('Please fill in both numbers');
                return;
            }

            try {
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        num1: parseFloat(num1),
                        num2: parseFloat(num2),
                        operator: operator
                    })
                });

                if (!response.ok) {
                    throw new Error('Calculation error');
                }

                const data = await response.json();

                document.getElementById('result-value').innerText = data.result;
                document.getElementById('pod-name').innerText = data.podName;
                document.getElementById('result-panel').classList.add('show');
            } catch (err) {
                alert('Error connecting to backend API');
                console.error(err);
            }
        }
    </script>
</body>
</html>
